linter: jetbrains/qodana-clang:2026.1
baseline:
  sed -i s/bookworm/bookworm trixie/g /etc/apt/sources.list.d/trixie.sources
  apt-get update
  apt-get install --no-install-recommends --no-install-suggests -y python3-pip libcgroup-dev gcc g++
  pip3 install compiledb --break-system-packages
  make configure
  ./configure --with-domjudge-user=qodana
  compiledb make inplace-config
  mkdir build
  cp compile_commands.json build/
