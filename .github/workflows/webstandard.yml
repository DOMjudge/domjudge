name: Webstandard (WCAG, W3C)
on:
  merge_group:
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  standards:
    needs: changes
    # Skip only when change detection ran and said so: a skipped job counts
    # as a passed required check, so if detection failed we must run.
    if: ${{ !cancelled() && needs.changes.outputs.webapp != 'false' }}
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: admin_password
      MYSQL_ROOT_PASSWORD: mysql_root_password
    container:
      image: domjudge/gitlabci:24.04
    services:
      sqlserver:
        image: mariadb
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      matrix:
        db: [bare-install, install]
    steps:
      - uses: actions/checkout@v4
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: webapp/node_modules
          key: npm-${{ hashFiles('webapp/package-lock.json') }}
          restore-keys: |
            npm-
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: webapp/vendor
          key: composer-${{ hashFiles('webapp/composer.lock') }}
          restore-keys: |
            composer-
      - name: Install DOMjudge
        run: .github/jobs/baseinstall.sh admin ${{ matrix.db }}
      - name: Run webstandard tests (W3C, WCAG) for all roles
        run: .github/jobs/webstandard_all.sh
      - name: Upload database dump for debugging
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: DB-dump${{ matrix.artifact_suffix }}
          path: /tmp/artifacts/db.sql
      - name: Upload all logs/artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: webstandard-${{ matrix.db }}-logs
          path: |
            /tmp/webstandard-logs
            /tmp/artifacts
            /var/log/nginx
            /opt/domjudge/domserver/webapp/var/log/*.log

  standards-gate:
    name: standards-gate
    needs: [changes, standards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix status
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more matrix jobs failed or were cancelled."
          exit 1
      - name: Success
        run: echo "All required jobs passed or were intentionally skipped."
