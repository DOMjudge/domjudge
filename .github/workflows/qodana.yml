name: Qodana
on:
  push:
    branches:
      - qodana_second_try
  #merge_group:
  #pull_request:
  #  branches:
  #    - main
  #    - '[0-9]+.[0-9]+'

jobs:
  qodana:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: php
            secret: QODANA_TOKEN
          - language: python
            secret: QODANA_PYTHON_TOKEN
          - language: js
            secret: QODANA_JS_TOKEN
          - language: jvm
            secret: QODANA_JVM_TOKEN
          - language: cpp
            secret: QODANA_CPP_TOKEN
          # We need a compile_commands.json
          - language: clang
            secret: QODANA_CPP_TOKEN
    permissions:
      packages: write
      attestations: write
      id-token: write
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: Gather right Qodana configuration files
        run: |
          mv .github/jobs/data/qodana_${{ matrix.language }}.sarif.json qodana.sarif.json || true
      - name: Build intermediate container
        run: |
          cd .github/jobs/data/
            mv qodana/${{ matrix.language }}/container.yml Dockerfile
            docker build -t domjudge/jetbrains-temp .
          cd ../../..
          set -x
          docker images
          docker run -t --entrypoint /bin/true domjudge/jetbrains-temp:latest
          docker run -t --entrypoint /bin/true docker.io/domjudge/jetbrains-temp:latest
      - name: Build compiler instructions
        if: ${{ (matrix.language == 'cpp') || (matrix.language == 'clang') }}
        run: |
          docker run  \
            -v "$(pwd):/data/project" -w "/data/project" \
            --entrypoint .github/jobs/data/qodana/${{ matrix.language }}/instructions.sh \
            domjudge/jetbrains-temp
          ls -atrl compile_commands.json | true
      - name: Show compiler instructions
        if: ${{ (matrix.language == 'cpp') || (matrix.language == 'clang') }}
        run: |
          cat compile_commands.json | true
          mkdir build
          cp compile_commands.json build/
      - name: Debug what is set
        run: echo "${{ github.token }}"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install Qodana CLI
        run: |
          curl -fsSL https://jb.gg/qodana-cli/install | bash

      - name: Run Qodana without pulling
        env:
          QODANA_TOKEN: ${{ secrets[matrix.secret] }}
        run: |
          qodana scan \
            --skip-pull \
            --within-docker true \
            --image domjudge/jetbrains-temp:latest \
            --baseline qodana.sarif.json \
            --fail-threshold 1000 \
            --compile-commands ./compile_commands.json \
            --print-problems

      #- name: 'Qodana Scan'
      #  uses: JetBrains/qodana-action@v2025.3
      #  with:
      #    args: |
      #      --skip-pull --within-docker true --image domjudge/jetbrains-temp:latest \
      #      --baseline qodana.sarif.json --fail-threshold 1000 \
      #      --compile-commands ./compile_commands.json \
      #      --print-problems
      #    upload-result: true
      #    skip-pull: true
      #    artifact-name: qodana-report-${{ matrix.language }}
      #    #pr-mode: true
      #    post-pr-comment: false
      #    #push-fixes: pull-request
      #  env:
      #    QODANA_TOKEN: ${{ secrets[matrix.secret] }}
      - name: Upload Qodana logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qodana-logs-${{ matrix.language }}
          path: /home/runner/work/_temp/qodana/results

  qodana-working:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: js
            secret: QODANA_JS_TOKEN
          - language: jvm
            secret: QODANA_JVM_TOKEN
          - language: python
            secret: QODANA_PYTHON_TOKEN
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Gather qodana baseline/config for linter
        run: |
          cp .github/jobs/data/qodana/${{ matrix.language }}/linter_config.yml qodana.yml || echo "Linter config for ${{ matrix.language }} is missing."
          cp .github/jobs/data/qodana/${{ matrix.language }}/sarif.json qodana.sarif.json || echo "Baseline for ${{ matrix.language }} is missing."
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.3
        with:
          args: |
            --baseline qodana.sarif.json
            --config qodana.yml
            --fail-threshold 1 \
            --print-problems \
            --apply-fixes
          upload-result: true
          artifact-name: qodana-report-${{ matrix.language }}
          pr-mode: true
          post-pr-comment: false
        env:
          QODANA_TOKEN: ${{ secrets[matrix.secret] }}
      - name: Upload Qodana logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qodana-logs-${{ matrix.language }}
          path: /home/runner/work/_temp/qodana/results
