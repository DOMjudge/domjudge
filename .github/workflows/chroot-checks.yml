name: Chroot checks
on:
  merge_group:
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  check-chroot-arch:
    needs: changes
    # Skip only when change detection ran and said so: a skipped job counts
    # as a passed required check, so if detection failed we must run.
    if: ${{ !cancelled() && needs.changes.outputs.chroot != 'false' }}
    runs-on: ubuntu-24.04
    container:
      image: domjudge/gitlabci:24.04
      options: --privileged --cgroupns=host --init
    strategy:
      matrix:
        arch: [amd64, default]
    steps:
      - name: Checkout current code
        uses: actions/checkout@v4
      - name: Install DOMjudge
        run: |
          .github/jobs/chroot_checks.sh ${{ matrix.arch }}
      - name: Upload all logs/artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-logs
          path: |
            /tmp/artifacts

  check-chroot-arch-gate:
    name: check-chroot-arch-gate
    needs: [changes, check-chroot-arch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix status
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more matrix jobs failed or were cancelled."
          exit 1
      - name: Success
        run: echo "All required jobs passed or were intentionally skipped."
