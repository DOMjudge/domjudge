name: Judge unit tests
on:
  merge_group:
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  judge-unit-tests:
    needs: changes
    # Skip only when change detection ran and said so: a skipped job counts
    # as a passed required check, so if detection failed we must run.
    if: ${{ !cancelled() && needs.changes.outputs.judge-unit != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: webapp/vendor
          key: composer-${{ hashFiles('webapp/composer.lock') }}
          restore-keys: |
            composer-

      - name: Install composer dependencies
        working-directory: webapp
        run: composer install --no-scripts --ignore-platform-reqs

      - name: Run judge unit tests
        working-directory: judge/tests
        run: ../../webapp/vendor/bin/phpunit --configuration phpunit.xml --testdox

  judge-unit-tests-gate:
    name: judge-unit-tests-gate
    needs: [changes, judge-unit-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix status
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more matrix jobs failed or were cancelled."
          exit 1
      - name: Success
        run: echo "All required jobs passed or were intentionally skipped."
