name: Judge unit tests
on:
  workflow_call:

jobs:
  judge-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        php-version: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: webapp/vendor
          key: composer-${{ hashFiles('webapp/composer.lock') }}
          restore-keys: |
            composer-

      - name: Install composer dependencies
        working-directory: webapp
        run: composer install --no-scripts --ignore-platform-reqs

      - name: Run judge unit tests
        working-directory: judge/tests
        run: ../../webapp/vendor/bin/phpunit --configuration phpunit.xml --testdox

  judge-unit-tests-gate:
    name: judge-unit-tests-gate
    needs: judge-unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix status
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more matrix jobs failed or were cancelled."
          exit 1
      - name: Success
        run: echo "All required jobs passed or were intentionally skipped."
