name: Run PHPStan
on:
  workflow_call:

jobs:
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # The version the CI container used to provide.
          php-version: '8.3'
          coverage: none
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: webapp/vendor
          key: composer-${{ hashFiles('webapp/composer.lock') }}
          restore-keys: |
            composer-
      - name: Setup composer dependencies
        run: .github/jobs/composer_setup.sh
      - name: Show the phpstan version
        run: webapp/vendor/phpstan/phpstan/phpstan --version
      - name: Generate the configuration files
        run: |
          make inplace-conf-common CONFIGURE_FLAGS='--with-domjudge-user=root ac_cv_lib_cgroup_cgroup_init=yes'
          make ci-conf-phpstan
      - name: Cache PHPStan results
        uses: actions/cache@v4
        with:
          # PHPStan's default tmpDir. It only reanalyses the files that
          # changed since the cached run, and their dependents.
          path: /tmp/phpstan
          key: phpstan-${{ github.run_id }}
          restore-keys: |
            phpstan-
      - name: Run PHPStan in the classic way
        shell: bash
        run: |
          set -euo pipefail
          webapp/vendor/bin/phpstan \
            --configuration=phpstan.dist.neon \
            --error-format=github \
          | tee /tmp/artifacts/phpstan.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          path: /tmp/artifacts
