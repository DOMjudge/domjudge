name: Run PHPStan
on:
  merge_group:
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  phpstan:
    needs: changes
    # Skip only when change detection ran and said so: a skipped job counts
    # as a passed required check, so if detection failed we must run.
    if: ${{ !cancelled() && needs.changes.outputs.phpstan != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # The version the CI container used to provide.
          php-version: '8.3'
          coverage: none
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: webapp/vendor
          key: composer-${{ hashFiles('webapp/composer.lock') }}
          restore-keys: |
            composer-
      - name: Setup composer dependencies
        run: .github/jobs/composer_setup.sh
      - name: Show the phpstan version
        run: webapp/vendor/phpstan/phpstan/phpstan --version
      - name: Generate the configuration files
        run: |
          make inplace-conf-common CONFIGURE_FLAGS='--with-domjudge-user=root ac_cv_lib_cgroup_cgroup_init=yes'
          make inplace-conf-phpstan
      - name: Run PHPStan in the classic way
        shell: bash
        run: |
          set -euo pipefail
          webapp/vendor/bin/phpstan \
            --configuration=phpstan.dist.neon \
            --error-format=github \
          | tee /tmp/artifacts/phpstan.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          path: /tmp/artifacts
