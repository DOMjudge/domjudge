name: Run compare.cc tests
on:
  merge_group:
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  compare:
    needs: changes
    # Skip only when change detection ran and said so: a skipped job counts
    # as a passed required check, so if detection failed we must run.
    if: ${{ !cancelled() && needs.changes.outputs.compare != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: domjudge/gitlabci:24.04
      options: --privileged --cgroupns=host --init
    steps:
      - uses: actions/checkout@v4
      - name: Run the actual compare.cc tests
        working-directory: misc-tests
        run: ./test_compare.sh
