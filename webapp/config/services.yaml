# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
imports:
    - { resource: static.yaml }

parameters:
    locale: en
    # Enable this to support removing time intervals from the contest.
    # This code is rarely tested and we discourage using it.
    removed_intervals: false
    # Minimum password length for users
    min_password_length: 10

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection'
            - '../src/Entity'
            - '../src/Kernel.php'

when@test:
    services:
        # Detects code that fails under innodb_snapshot_isolation=ON, see
        # tests/SnapshotIsolation/TransactionTracker.php. The low priority puts it outside
        # DAMADoctrineTestBundle's middleware, so it sees the application's transactions
        # instead of the one DAMA wraps around each test.
        App\Tests\SnapshotIsolation\SnapshotIsolationMiddleware:
            # Otherwise it is tagged a second time at the default priority.
            autoconfigure: false
            tags:
                - { name: 'doctrine.middleware', priority: -100 }
