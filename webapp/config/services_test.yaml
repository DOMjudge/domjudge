parameters:
    # The benchmark is a busy loop, don't spend seconds on it on every visit of the check page.
    hash_benchmark_seconds: 0

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Support code for tests that observe how requests use the session.
    App\Tests\Session\:
        resource: '../tests/Session/'

    # Resets stateful services between requests of one test kernel.
    App\Tests\Support\:
        resource: '../tests/Support/'
